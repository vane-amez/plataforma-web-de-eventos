<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Plataforma de Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body class="bg-light">
    <header class="p-3 bg-dark text-white">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-between">
                <a href="../index.html" class="text-white text-decoration-none fs-4 fw-bold">EventApp</a>
                <div class="text-end">
                    <a href="../index.html" class="btn btn-outline-light">Volver al Inicio</a>
                </div>
            </div>
        </div>
    </header>
    <main class="container my-5">
        <section class="login">
            <div class="login-class shadow-sm">
                <form>
                    <div class="campo">
                        <h1 class="title fs-3 fw-bold mb-3">Iniciar Sesión</h1>
                        <span>Usuario</span>
                        <input id="user" type="text" class="form-control" placeholder="Ej: admin">
                    </div>
                    <div class="campo">
                        <span>Contraseña</span>
                        <input id="password" type="password" class="form-control" placeholder="Ej: admin">
                    </div>
                    <div class="button-c mt-4">
                        <button onclick="inicio()" type="button" class="btn btn-primary w-100">Ingresar</button>
                    </div>
                    <p id="mensaje-error" class="text-center mt-3"></p>
                </form>
            </div>
        </section>
    </main>
    <script src="../js/inicio.js"></script>
</body>

</html>
