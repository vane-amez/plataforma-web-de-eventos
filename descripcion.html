<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalles del Evento</title>
    <link rel="stylesheet" href="../css/descripcion.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  </head>
  
  <body> 
    <header>
      <div class="nav">
        <div class="nav-content">
          <img src="../img/Logo Siex Events@1x.png" alt="Logo" />
          <p>El momento es ahora, crecer también.</p>
        </div>
        <div class="btn">
          <a href="#" id="btnCerrar">Log out</a>
        </div>
      </div>
    </header>

    <div class="container">
      <h1>Detalles del evento</h1>
      <div class="img">
        <img src="https://img.lalr.co/cms/2016/09/20144149/freddyvega.jpg?size=xs" alt="Conferencia AI">
      </div>
      <div class="card">
      </div>
    </div>

    <a href="https://wa.me/573000000000?text=Hola,%20deseo%20más%20información" target="_blank" 
       class="position-fixed bottom-0 end-0 m-4 btn btn-success rounded-circle p-3 shadow-lg d-flex align-items-center justify-content-center" 
       style="width: 60px; height: 60px; z-index: 1000;">
        <i class="bi bi-whatsapp fs-3"></i></a>
        
    <footer class="text-center py-4 text-muted border-top bg-white">
        <p class="mb-0">&copy; 2026 Plataforma Web de Eventos</p>
    </footer>

    <script>
      var autorizado = localStorage.getItem('autorizado');
      if (autorizado != "true") {
        window.location.href = "./login/index.html";
      }

      document.getElementById('btnCerrar').addEventListener('click', function(e) {
        e.preventDefault();
        localStorage.removeItem('autorizado');
        window.location.href = "../index.html";
      });
    </script>
  </body>
</html>
